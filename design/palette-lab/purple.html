<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>Side Atlas · 紫色深浅对比</title>
<style>
  body { margin:0; background:#f8f7fb; color:#1b1a26; font:15px/1.6 "PingFang SC", -apple-system, system-ui, sans-serif; }
  .wrap { max-width:1480px; margin:0 auto; padding:32px; }
  h1 { font-size:26px; margin:0 0 4px; }
  p.lead { color:#6b6a7a; margin:0 0 18px; }
  .row { background:#fff; border:1px solid #e6e4ef; border-radius:22px; padding:18px 20px; margin-bottom:20px; }
  .row header { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:10px; }
  .row header b { font-size:18px; }
  .sw { display:inline-flex; align-items:center; gap:6px; font:12px/1 ui-monospace, Menlo, monospace; color:#6b6a7a; }
  .sw i { width:18px; height:18px; border-radius:6px; display:inline-block; }
  .note { color:#6b6a7a; font-size:14px; }
  .shots { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .shots img { width:100%; border-radius:12px; border:1px solid #e6e4ef; display:block; }
  .tag { font-size:12px; padding:2px 10px; border-radius:99px; background:#ffe3f0; color:#b0306f; }
</style>
</head>
<body>
<div class="wrap">
  <h1>紫色深浅对比 · 都配粉色点缀 #FF7AB6</h1>
  <p class="lead">同一个原型只换主色。C 是上一轮的电光紫，C1–C3 是"没那么紫"的版本。Twitch 原来的紫色和主色太接近，这几版先换成了蓝色。</p>

  <div class="row"><header><b>C · 电光紫（上一轮）</b><span class="sw"><i style="background:#5B2BD6"></i>#5B2BD6</span><span class="note">最紫、最亮</span></header>
    <div class="shots"><img src="c_violet_overview.png" alt=""><img src="c_violet_tax.png" alt=""></div></div>

  <div class="row"><header><b>C1 · 靛蓝紫</b> <span class="tag">推荐</span><span class="sw"><i style="background:#4B4FC4"></i>#4B4FC4</span><span class="note">偏蓝一点，紫味变少，配粉色依然活泼；看起来更像金融产品</span></header>
    <div class="shots"><img src="c1_indigo_overview.png" alt=""><img src="c1_indigo_tax.png" alt=""></div></div>

  <div class="row"><header><b>C2 · 柔和紫</b><span class="sw"><i style="background:#6B5BC2"></i>#6B5BC2</span><span class="note">还是紫，但降了饱和度，更温柔、更"潮玩"</span></header>
    <div class="shots"><img src="c2_soft_overview.png" alt=""><img src="c2_soft_tax.png" alt=""></div></div>

  <div class="row"><header><b>C3 · 深靛蓝</b><span class="sw"><i style="background:#2F3788"></i>#2F3788</span><span class="note">几乎是深蓝，最稳重；粉色点缀会最跳</span></header>
    <div class="shots"><img src="c3_deepindigo_overview.png" alt=""><img src="c3_deepindigo_tax.png" alt=""></div></div>
</div>
</body>
</html>
