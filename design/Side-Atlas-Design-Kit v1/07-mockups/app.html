<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Side Atlas · prototype v1.3</title>
<link rel="icon" href="../02-logos/app-icons-and-favicons/favicon.svg">
<link rel="stylesheet" href="../05-css/side-atlas-ui-reference.css">
<script src="../03-icons/side-atlas-icons.js"></script>
<script src="data.js"></script>
<script src="data-v13.js"></script>
<script src="data-v131-ledger.js"></script>
<script src="data-v14.js"></script>
<script src="copy-v14.js"></script>
<script src="copy-v13.js"></script>
<script>
/* UI is single-language (English). Source data keeps "B站", Chinese record types and names; map them for display. */
(() => {
  const EXACT = {"充电":"Power-up","礼物":"Gift","SC":"Super Chat","舰长":"Captain (guard)","提督":"Admiral (guard)","总督":"Governor (guard)","提现代扣个税":"Tax withheld at withdrawal","平台代扣代缴":"Withheld and paid by the platform","大额单笔":"Large single payment"};
  const INLINE = [["B站","Bilibili"],["B 站","Bilibili"],["月之灵","Moon Spirit"],["小鹿","Xiao Lu"],["阿柚","A You"],["墨白","Mo Bai"]];
  const CJK = /[\u4e00-\u9fff]/;
  const en = (v, k) => {
    if (typeof v === "string") { let o = v in EXACT ? EXACT[v] : v; for (const [c, e] of INLINE) o = o.split(c).join(e); return CJK.test(o) && /profile|note|basis/.test(k) ? "" : o; }
    if (Array.isArray(v)) return v.map(x => en(x, k));
    if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([kk, x]) => [kk, en(x, kk)]));
    return v;
  };
  window.SA_DATA = en(window.SA_DATA, "");
  if (window.SA_V13) window.SA_V13 = en(window.SA_V13, "");
  if (window.SA_V131_LEDGER) window.SA_V131_LEDGER = en(window.SA_V131_LEDGER, "");
  if (window.SA_V14_RAW) window.SA_V14_RAW = en(window.SA_V14_RAW, "");
})();
</script>
</head>
<body>
<div class="sa-app">
  <aside class="sa-side">
    <div class="sa-logo">
      <img class="mark" src="../02-logos/icon-256.png" alt="">
      <div><b>Side Atlas</b></div>
    </div>
    <div class="sa-mode" id="mode" aria-label="Data"></div>
    <nav class="sa-nav" id="nav"></nav>
    <div class="foot">
      <nav class="sa-util" id="util"></nav>
      <div class="tag" id="tagline"></div>
      <span class="sa-prism" id="prism"><i></i>Every run traced in PRISM</span>
      <div class="meta" id="disclaimer"></div>
    </div>
  </aside>
  <main class="sa-main" id="main"></main>
</div>

<script>
const D = window.SA_DATA, C = D.copy;
const PCOL = k => ({ fill: `var(--sa-p-${k})`, tint: `var(--sa-p-${k}-tint)`, text: `var(--sa-p-${k}-text)` });
// Platform marks (v1.4.1): Simple Icons in brand colours, letter marks for Contra and Fiverr; unknown keys keep the dot.
const PICON = k => ["bilibili", "youtube", "twitch", "patreon", "upwork", "fiverr", "freelancer", "contra"].includes(k)
  ? `<img class="sa-picon" src="../02-logos/platforms/${k}.svg" alt="" width="16" height="16">` : `${PICON(k)}`;
const usd = v => (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = v => "$" + Math.round(v).toLocaleString("en-US");
const cny = v => "¥" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (v * 100).toFixed(1) + "%";
const icon = (n, cls = "") => `<svg class="sa-icon ${cls}"><use href="#sa-i-${n}"/></svg>`;
const monthName = m => new Date(m + "-01T12:00:00").toLocaleString("en-US", { month: "long" });
const dateLong = d => new Date(d + "T12:00:00").toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric" });

/* v1.3 nav: exactly four screens (decision #23). My data and Settings & privacy are utility links in the
   sidebar foot; every other screen is a route reached from inside the four. */
const NAV = [["overview", "Overview", "overview"], ["ledger", "Ledger", "ledger"], ["tax", "Tax", "tax"], ["ask", "Ask Atlas", "ask"]];
// v1.4: Milestones joins the utility links (decision #47); the nav stays at four.
const UTIL = [["mydata", "My data", "upload"], ["milestones", "Milestones", "award"], ["privacy", "Settings & privacy", "shield"]];
const V = window.SA_V13, X = window.SA_COPY_V13;
const yen = v => (v < 0 ? "−" : "") + "¥" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateShort = d => new Date(d + "T12:00:00").toLocaleString("en-US", { month: "short", day: "numeric" });

function who(name, cjk, meta) {
  return `<div class="sa-who"><div class="av">${cjk ? `<span class="cjk">${cjk}</span>` : name[0]}</div><div><b>${name}</b><span>${meta}</span></div></div>`;
}
function periodSeg(on) {
  return `<div class="sa-seg">${["Jul", "Aug", "Sep", "Q3 2026"].map(p => `<button class="${p === on ? "on" : ""}">${p}</button>`).join("")}</div>`;
}
const moon = () => who("Moon Spirit", "", "New York · US tax home · single-member LLC");

/* ---------------- Overview ---------------- */
function overview() {
  const o = D.overview_c01_sep, t = o.totals, mom = o.month_over_month;
  const wf = [
    ["Net", t.net, "var(--sa-net)"], ["Platform fees", t.platform_fee, "var(--sa-fee)"],
    ["Payout & payment fees", t.payout_fee, "var(--sa-payout)"], ["Tax withheld by platforms", t.withheld, "var(--sa-tax)"]];
  const plats = [...o.platforms].sort((a, b) => b.net - a.net);
  return `
  <div class="sa-top"><div><h1>Overview</h1></div>
    <div class="right">${periodSeg("Sep")}${moon()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c7">
      <div class="orb"></div>
      <div class="lead">${C.OVERVIEW_HERO.replace("{month}", "September")}</div>
      <div class="sa-fig num">${usd(t.net)}</div>
      <div class="sub">from <b class="num">${usd(t.gross)}</b> gross across ${o.platforms.length} platforms</div>
      <div class="chips">
        <span class="glass">${icon("up", "sm")} ${usd(mom.change)} vs August (${mom.change_pct > 0 ? "+" : ""}${pct(mom.change_pct)})</span>
        <span class="glass">${icon("fx", "sm")} CNY converted at each record’s own date</span>
      </div>
    </section>
    <div class="c5 stack">
      <div class="sa-card sa-kpi"><div class="label">${icon("tax", "sm")} Set aside at your ${Math.round(o.set_aside.rate * 100)}%</div>
        <div class="sa-fig forest num">${usd(o.set_aside.amount)}</div>
        <div class="note">Next US estimated tax: <b>Jan 15, 2027</b> · 90 days</div></div>
      <div class="sa-card sa-kpi"><div class="label">${icon("check", "sm")} Keeps the most of each dollar</div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:10px">
          <div class="sa-fig num" style="margin:0">${o.best_keep_rate.label}</div><span class="sa-badge ok">${pct(o.best_keep_rate.net_rate)} kept</span></div>
        <div class="note" style="margin-top:6px">Lowest: Bilibili keeps ${pct(o.platforms.find(p => p.platform === "bilibili").net_rate)} after its 50% share</div></div>
    </div>
    <section class="sa-card c7">
      <div class="head"><h2>Where the gross went</h2><span class="meta num">${usd(t.gross)} gross</span></div>
      <div class="sa-bar">${wf.map(([l, v, c]) => `<span title="${l}" style="width:${(v / t.gross * 100).toFixed(2)}%;background:${c}"></span>`).join("")}</div>
      <ul class="sa-legend">
        <li><span class="dot" style="background:var(--sa-line-strong)"></span><span>Gross income</span><span class="amt">${usd(t.gross)}</span><span class="pct">100%</span></li>
        ${wf.slice(1).map(([l, v, c]) => `<li><span class="dot" style="background:${c}"></span><span>${l}</span><span class="amt">${usd(-v)}</span><span class="pct">${pct(v / t.gross)}</span></li>`).join("")}
        <li class="total"><span class="dot" style="background:var(--sa-net)"></span><span>Net (what landed)</span><span class="amt">${usd(t.net)}</span><span class="pct">${pct(t.net / t.gross)}</span></li>
      </ul>
    </section>
    <section class="sa-card c5">
      <div class="head"><h2>By platform</h2><span class="meta">share of net</span></div>
      <div class="sa-bar">${plats.map(p => `<span title="${p.label}" style="width:${(p.share_of_net * 100).toFixed(2)}%;background:${PCOL(p.platform).fill}"></span>`).join("")}</div>
      <ul class="sa-legend">${plats.map(p => `<li>${PICON(p.platform)}<span>${p.label}</span><span class="amt">${usd(p.net)}</span><span class="pct">${pct(p.net_rate)} kept</span></li>`).join("")}</ul>
    </section>
  </div>`;
}

/* ---------------- Ledger ---------------- */
function ledger() {
  const L = D.ledger_c01_sep, t = L.totals;
  const rows = [...L.rows].sort((a, b) => a.date.localeCompare(b.date) || a.platform.localeCompare(b.platform));
  const cell = (v, cls) => `<td class="money ${v === 0 ? "zero" : cls}">${v === 0 ? "—" : usd(cls === "net" ? v : -v)}</td>`;
  return `
  <div class="sa-top"><div><h1>Ledger</h1></div><div class="right">${periodSeg("Sep")}${moon()}</div></div>
  <div class="sa-kpirow">
    ${[["Gross", t.gross, ""], ["Platform fees", -t.platform_fee, "var(--sa-fee-text)"], ["Payout fees", -t.payout_fee, "var(--sa-payout-text)"], ["Tax withheld", -t.withheld, "var(--sa-tax-text)"], ["Net", t.net, "var(--sa-forest)"]]
      .map(([l, v, c]) => `<div class="sa-card sa-kpi"><div class="label">${l}</div><div class="sa-fig num" style="${c ? `color:${c}` : ""}">${usd(v)}</div></div>`).join("")}
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <span class="sa-chip on">All · ${rows.length} records</span>
    ${D.overview_c01_sep.platforms.map(p => `<span class="sa-chip">${PICON(p.platform)}${p.label}</span>`).join("")}
    <span style="margin-left:auto" class="sa-btn secondary sm">${icon("filter", "sm")} Type</span>
    <span class="sa-btn secondary sm">${icon("download", "sm")} CSV</span>
  </div>
  <div class="sa-tablewrap"><table class="sa-table dense">
    <thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Original</th><th class="money">Gross</th><th class="money">Platform fee</th><th class="money">Payout fee</th><th class="money">Withheld</th><th class="money">Net</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="num">${r.date.slice(5).replace("-", "/")}</td>
      <td>${PICON(r.platform)}${r.platform_label}</td>
      <td>${r.type}${r.ref ? `<span class="sub">${r.ref}</span>` : ""}</td>
      <td class="num">${r.original.currency === "USD" ? `<span class="meta">USD</span>` : `${cny(r.original.gross)}<span class="fx">÷ ${r.fx.rate.toFixed(4)} · ${r.fx.rate_date}</span>`}</td>
      <td class="money">${usd(r.gross_usd)}</td>${cell(r.platform_fee_usd, "fee")}${cell(r.payout_fee_usd, "payout")}${cell(r.withheld_usd, "tax")}<td class="money net">${usd(r.net_usd)}</td></tr>`).join("")}
      <tr class="total"><td colspan="4">September total</td><td class="money">${usd(t.gross)}</td><td class="money">${usd(-t.platform_fee)}</td><td class="money">${usd(-t.payout_fee)}</td><td class="money">${usd(-t.withheld)}</td><td class="money">${usd(t.net)}</td></tr>
    </tbody></table></div>`;
}

/* ---------------- Tax items (hero) ---------------- */
const STATUS = {
  not_applicable: `<span class="sa-badge tax">CN tax record</span>`,
  over_so_far: `<span class="sa-badge sim">1099-MISC likely</span>`,
  projected_over: `<span class="sa-badge sim">1099-MISC projected</span>`,
  below: `<span class="sa-badge sim">Below 1099-K threshold</span>`,
};
function tax() {
  const T = D.tax_c01_q3, F = D.forms_c01_q3, tot = F.totals, P = D.forms_c12_fiverr;
  const w = T.tax_withheld_by_platform[0];
  const gapBar = f => {
    const g = f.gap || 0, it = f.gap_items;
    if (!g) return `<span class="meta">${f.form_view === null ? "no US form" : "no gap"}</span>`;
    return `<div style="display:flex;align-items:center;gap:10px"><div class="sa-gap">${[[it.platform_fees, "var(--sa-fee)"], [it.payout_fees, "var(--sa-payout)"], [it.tax_withheld, "var(--sa-tax)"], [it.refunds, "var(--sa-line-strong)"]]
      .map(([v, c]) => v > 0 ? `<span style="width:${Math.max(4, v / g * 100)}%;background:${c}"></span>` : "").join("")}</div><span class="num">${usd(-g)}</span></div>`;
  };
  return `
  <div class="sa-top"><div><h1>Tax items</h1></div><div class="right">${periodSeg("Q3 2026")}${moon()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c8" style="display:grid;grid-template-columns:1fr 210px;gap:24px;min-height:220px">
      <div>
        <div class="lead" style="font:800 30px/1.15 var(--sa-font);color:var(--sa-on-forest);letter-spacing:-.02em">${C.TAX_HERO}</div>
        <div class="sub" style="margin-top:10px;max-width:470px">${C.TAX_SUB}</div>
        <div style="margin-top:20px;position:relative">
          <div class="sa-fig num" style="margin:0 0 6px;font-size:48px">${usd(T.set_aside.amount)}</div>
          <div class="sub">to set aside: ${usd(T.total_net_usd)} Q3 net × the 25% you chose</div>
        </div>
      </div>
      <div class="sa-count" style="align-self:end">
        <div class="days num">${T.next_us_estimated_tax_due.days_left}</div>
        <div class="of">days to the next US<br>estimated-tax payment</div>
        <div class="glass" style="margin-top:12px">${icon("calendar", "sm")} ${dateLong(T.next_us_estimated_tax_due.due_date)}</div>
      </div>
    </section>
    <section class="sa-card c4">
      <div class="head"><h2>Tax already withheld</h2></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div><span class="sa-badge tax">${icon("globe", "sm")} China · ${w.platform}</span>
          <div class="meta" style="margin-top:8px">Individual income tax, withheld by the platform</div></div>
        <div style="text-align:right"><div class="sa-fig num" style="font:800 28px/1 var(--sa-font);color:var(--sa-tax-text)">${usd(w.withheld_usd)}</div><div class="meta num">${cny(w.withheld_cny)}</div></div>
      </div>
      <div class="sa-note info" style="margin-top:16px">${icon("info", "sm")}<span>Nothing was withheld on Contra, Fiverr, Patreon, Twitch, Upwork or YouTube. The set-aside covers that income.</span></div>
    </section>
    <section class="sa-card c12">
      <div class="head"><div><h2>${C.FORMS_HEADLINE}</h2><div class="mid" style="margin-top:6px;max-width:820px">${C.FORMS_SUB}</div></div></div>
      <div class="sa-note info" style="margin-bottom:14px;font-size:14px">${icon("check", "sm")}<span>${C.THRESHOLD_BANNER}</span></div>
      <div class="sa-tablewrap"><table class="sa-table">
        <thead><tr><th>Platform</th><th>Form (simulated)</th><th>Paid out to</th><th class="money">Form view</th><th class="money">Bank view</th><th>${C.GAP_LABEL}</th><th class="money">Txns</th><th>Status</th></tr></thead>
        <tbody>${F.rows.map(f => `<tr>
          <td>${PICON(f.platform)}<b>${f.label}</b></td>
          <td>${f.form === "none" ? `<span class="sa-badge tax">No US form</span>` : `<span class="sa-badge sim">${f.form}</span>`}</td>
          <td>${f.payout_method === "PayPal" ? `<b>PayPal</b>` : `<span class="meta">${f.payout_method}</span>`}</td>
          <td class="money">${f.form_view === null ? `<span class="meta">—</span>` : usd(f.form_view)}</td><td class="money net">${usd(f.bank_view)}</td>
          <td>${gapBar(f)}</td>
          <td class="money">${f.transactions}</td>
          <td><div style="display:flex;gap:6px;flex-wrap:wrap">${STATUS[f.status] || ""}${f.duplicate ? `<span class="sa-badge warn">${icon("duplicate", "sm")} Possible duplicate</span>` : ""}</div></td></tr>`).join("")}
          <tr class="total"><td colspan="3">Platforms with US forms</td><td class="money">${usd(tot.form_view_gross_usd)}</td><td class="money">${usd(tot.bank_view_landed_usd)}</td><td><span class="num">${usd(-tot.gap_usd)}</span></td><td></td><td></td></tr>
        </tbody></table></div>
      <div class="meta" style="margin-top:10px;display:flex;gap:6px;align-items:center">${icon("info", "sm")} ${C.SIMULATED_NOTE} 1099-MISC status uses a simulated $2,000 example threshold.</div>
      <div class="sa-grid" style="margin-top:12px;gap:12px">
        <div class="sa-note warn c7">${icon("duplicate", "sm")}<span>${C.DUPLICATE_NOTE_FIVERR}</span></div>
        <div class="sa-note info c5">${icon("info", "sm")}<span>${C.CONTRAST_PRIYA} <span class="num">(${P.transactions} transactions)</span></span></div>
      </div>
    </section>
    <section class="sa-card c12" style="display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start">
      <div><div class="head"><h2>For your accountant</h2></div>
        <ul class="sa-check">${T.items_for_accountant.map((x, i) => `<li><span class="box ${i === 1 ? "done" : ""}"></span><span>${x}</span></li>`).join("")}
          <li><span class="box"></span><span>Fiverr pays out to PayPal: check the Fiverr and PayPal 1099-Ks for the same income.</span></li>
          <li><span class="box"></span><span>Keep this forms-vs-bank reconciliation (gap ${usd(tot.gap_usd)}: platform fees and payout fees) with your records.</span></li></ul></div>
      <a class="sa-btn primary">${icon("download", "sm")} Export for my accountant</a>
    </section>
  </div>`;
}

/* ---------------- Ask ---------------- */
function ask() {
  const A = D.ask_example, o = D.overview_c01_sep, t = o.totals;
  const lines = [["Gross income", t.gross, 10], ["Platform fees", -t.platform_fee, 10], ["Payout & payment fees", -t.payout_fee, 10], ["Tax withheld by Bilibili", -t.withheld, 10], ["Set aside at your 25%", o.set_aside.amount, 10]];
  return `
  <div class="sa-top"><div><h1>Ask</h1><p>The agent looks things up step by step; code does the math.</p></div><div class="right">${moon()}</div></div>
  <div class="sa-grid">
    <div class="c7 stack">
      <div class="sa-bubble">${A.question}</div>
      <section class="sa-hero sa-answer" style="min-height:0">
        <div class="lead">You landed in September 2026</div>
        <div class="sa-fig num">${usd(t.net)}<span class="sa-ref">11</span></div>
        <div class="sub">out of ${usd(t.gross)} gross across 7 platforms. Contra kept the most of each dollar (100%), <span class="num">Bilibili</span> the least (${pct(o.platforms.find(p => p.platform === "bilibili").net_rate)}).</div>
      </section>
      <section class="sa-card" style="padding:18px 24px">
        <ul class="sa-lines">${lines.map(([l, v, s]) => `<li><span>${l}</span><span class="amt">${usd(v)}<span class="sa-ref light">${s}</span></span></li>`).join("")}</ul>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px">
          <span class="meta" style="display:flex;gap:6px;align-items:center;color:var(--sa-forest)">${icon("check", "sm")} ${C.ASK_PROMISE}</span>
          <span class="sa-prism"><i></i>Traced in PRISM ${icon("external", "sm")}</span>
        </div>
      </section>
      <div class="sa-input"><span>${C.ASK_PLACEHOLDER}</span><a class="sa-btn primary sm">${icon("send", "sm")} Ask</a></div>
    </div>
    <section class="sa-card c5">
      <div class="head"><h2>Agent steps</h2><span class="sa-badge ok">${A.trace.steps} tool calls</span></div>
      <ol class="sa-steps">${A.steps.map((s, i) => `<li class="${i === A.steps.length - 1 ? "final" : ""}"><span class="n">${i + 1}</span><div><div class="t">${s.tool}<span class="meta" style="font-family:var(--sa-font)"> · ${s.args}</span></div><div class="s">${s.summary}</div></div>${icon("check", "sm")}</li>`).join("")}</ol>
    </section>
  </div>`;
}

/* ---------------- Report ---------------- */
function report() {
  const R = D.report_c01_q3, t = R.totals;
  return `
  <div class="sa-top"><div><h1>Report</h1><p>Hand this to your accountant. Every figure links back to the ledger.</p></div><div class="right">${periodSeg("Q3 2026")}${moon()}</div></div>
  <div class="sa-grid">
    <div class="c8 sa-sheet">
      <div class="band"><div class="label" style="color:var(--sa-on-forest-mid)">Side Atlas · Q3 2026 report</div><h1>${C.REPORT_COVER}</h1>
        <div class="meta">Moon Spirit · US tax home · single-member LLC · prepared Oct 17, 2026</div></div>
      <div class="body">
        <div class="sa-totals">${[["Gross", t.gross], ["Platform fees", -t.platform_fee], ["Payout fees", -t.payout_fee], ["Tax withheld", -t.withheld]].map(([l, v]) => `<div><span class="label">${l}</span><b>${usd(v)}</b></div>`).join("")}<div class="net"><span class="label">Net</span><b>${usd(t.net)}</b></div></div>

function bindSettings() {
  const S = D.settings_c01, all = S.total_net;
  const amt = document.getElementById("sa-amt"), base = document.getElementById("sa-base"), note = document.getElementById("sa-note25");
  const slider = document.getElementById("sa-rate"), input = document.getElementById("sa-rate-in");
  const update = r => {
    r = Math.max(0, Math.min(100, Number(r) || 0));
    slider.value = Math.min(50, r); input.value = r;
    document.querySelectorAll("#sa-presets button").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
    let net = all;
    document.querySelectorAll(".sa-togglelist li").forEach(li => { if (!li.querySelector(".sa-toggle").classList.contains("on")) net -= Number(li.dataset.net); });
    const full = net === all && r === 25;
    amt.textContent = full ? usd(S.set_aside) : usd(Math.round(net * r) / 100);
    base.textContent = `= ${usd(net)} Q3 net × ${r}%`;
    note.style.visibility = full ? "visible" : "hidden";
  };
  slider.addEventListener("input", e => update(e.target.value));
  input.addEventListener("input", e => update(e.target.value));
  document.querySelectorAll("#sa-presets button").forEach(b => b.addEventListener("click", () => update(b.dataset.r)));
  document.querySelectorAll(".sa-toggle").forEach(t => t.addEventListener("click", () => { t.classList.toggle("on"); t.closest("li").classList.toggle("off"); update(input.value); }));
}

/* ---------------- 17 · Ledger in CNY (August): 17 no rate file (ECB), 17b your rate file with a gap ---------------- */
// Rule (decision #45): a currency with your rate file uses it exactly, and a date it lacks stops the record;
// only a currency without one uses ECB reference rates, a weekend or holiday taking the last publication before it.
// Data: the real POST /api/personal/ledger response for both cases (data-v131-ledger.js).
function ledgerCnyCase(kind) {
  const LG = window.SA_V131_LEDGER[kind], t = LG.totals, iss = LG.issues[0];
  const wd = d => new Date(d + "T12:00:00").toLocaleString("en-US", { weekday: "short" });
  const conv = LG.rows.filter(r => r.fx_cny || r.issue);
  const earlier = conv.filter(r => r.fx_cny && r.fx_cny.rate_date !== r.date).length;
  const rateLine = r => {
    if (r.issue) return `<span class="rate miss">Your rate file has no rate for this date</span>`;
    const f = r.fx_cny; if (!f) return "";
    const ecb = f.source === "ECB reference rate";
    const label = ecb && f.rate_date !== r.date ? `<span class="src">ECB rate of ${wd(f.rate_date)} ${dateShort(f.rate_date)}</span>`
      : `${dateShort(f.rate_date)} · <span class="src">${ecb ? "ECB reference rate" : "Your rate file"}</span>`;
    return `<span class="rate">× ${f.rate.toFixed(4)} · ${label}</span>`;
  };
  const cell = (v, cls, neg) => !v ? `<td class="money zero">—</td>` : `<td class="money ${cls}">${yen(neg ? -v : v)}</td>`;
  const orig = r => r.original.currency === "CNY" ? `${cny(r.original.gross)}<span class="sub">CNY</span>` : `$${r.original.gross.toLocaleString("en-US", { minimumFractionDigits: 2 })}<span class="sub">USD</span>`;
  const head = r => `<td class="num">${r.date.slice(5).replace("-", "/")}</td><td>${PICON(r.platform)}${r.platform_label}</td><td>${r.type}${r.ref ? `<span class="sub">${r.ref}</span>` : ""}</td><td class="num">${orig(r)}</td>`;
  const sources = kind === "ecb"
    ? `ECB reference rates <b class="num" style="color:var(--sa-ink)">${conv.length}</b> · ${earlier} from an earlier working day`
    : `Your rate file <b class="num" style="color:var(--sa-ink)">${conv.length - LG.issues.length}</b> · missing <b class="num" style="color:var(--sa-warn-text)">${LG.issues.length}</b>`;
  return `
  <div class="sa-top"><div><h1>Ledger</h1></div><div class="right">${curSeg("CNY")}${periodSeg("Aug")}${you()}</div></div>
  <div class="sa-kpirow">
    ${[["Gross", t.gross, ""], ["Fees", -(t.platform_fee + t.payout_fee), "var(--sa-fee-text)"], ["Tax withheld", -t.withheld, "var(--sa-tax-text)"], [LG.complete ? "Net" : "Net · incomplete", t.net, "var(--sa-forest)"]]
      .map(([l, v, c]) => `<div class="sa-card sa-kpi"><div class="label">${l}</div><div class="sa-fig num" style="${c ? `color:${c}` : ""}">${yen(v)}</div></div>`).join("")}
    <div class="sa-card sa-kpi"><div class="label">${icon("fx", "sm")} Rates for USD records</div><div class="meta" style="margin-top:10px;line-height:1.6">${sources}</div></div>
  </div>
  ${iss ? `<section class="sa-warncard" style="display:grid;grid-template-columns:1fr 380px;gap:24px;margin-bottom:16px">
    <div><div class="tag">${icon("alert", "sm")} Calculation stopped</div><div class="title">${X.RATE_STOP_TITLE}</div><p class="body" style="margin:0">${X.RATE_STOP_BODY}</p>
      <div class="actions"><a class="sa-btn primary sm">Add the ${dateShort(iss.date)} rate</a><a class="sa-btn secondary sm">Open my rate file</a></div></div>
    <dl class="sa-kv">${[["Platform", iss.platform], ["Reference", iss.record.ref], ["Amount", "$" + iss.record.amount.toFixed(2)], ["Date", dateLong(iss.date)]].map(([k, v]) => `<dt>${k}</dt><dd class="num">${v}</dd>`).join("")}<dt>CNY rate</dt><dd class="miss">missing</dd></dl>
  </section>` : ""}
  <div class="sa-note info" style="margin-bottom:14px">${icon("info", "sm")}<span>${kind === "ecb" ? X.LEDGER_ECB_NOTE : X.LEDGER_FILE_NOTE}</span></div>
  <div class="sa-tablewrap"><table class="sa-table dense">
    <thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Original</th><th class="money">Gross (CNY)</th><th class="money">Fees</th><th class="money">Withheld</th><th class="money">Net (CNY)</th></tr></thead>
    <tbody>${LG.rows.map(r => r.issue ? `<tr class="missing">${head(r)}
      <td class="money"><span class="sa-badge warn">rate missing</span>${rateLine(r)}</td><td colspan="3" class="money meta">left out of totals</td></tr>` : `<tr>${head(r)}
      <td class="money">${r.gross_cny ? yen(r.gross_cny) : "—"}${rateLine(r)}</td>${cell(r.platform_fee_cny + r.payout_fee_cny, "fee", true)}${cell(r.withheld_cny, "tax", true)}<td class="money net">${yen(r.net_cny)}</td></tr>`).join("")}
      <tr class="total"><td colspan="4">August total${LG.complete ? "" : ` · ${LG.issues.length} record left out`}</td><td class="money">${yen(t.gross)}</td><td class="money">${yen(-(t.platform_fee + t.payout_fee))}</td><td class="money">${yen(-t.withheld)}</td><td class="money">${yen(t.net)}</td></tr>
    </tbody></table></div>`;
}

/* ================= v1.4 · all side income: entries, expenses, goal, milestones ================= */
// Numbers: data-v14.js from gen_data_v14.py (POST /api/personal/ledger in-process + daoshou/rewards.py + the C01
// manual-entries fixture). Copy: copy-v14.js (GPT-6 Astra). Badge reasons below are number labels built from rewards.py.
const R = window.SA_V14_RAW, Y = window.SA_COPY_V14;
const money = v => (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money0 = v => "$" + Math.round(v).toLocaleString("en-US");
const BCOPY = { first_1k_month: "B1", best_month: "B2", growth_streak_3: "B3", new_source: "B4", five_sources: "B5", new_currency: "B6", total_10k: "B7", complete_month: "B8" };
const reasonOf = b => { const n = b.numbers; switch (b.id) {
  case "first_1k_month": return `${monthName(n.month)}: ${money(n.income_usd)} income`;
  case "best_month": return `${monthName(n.month)}: ${money(n.income)}, above ${monthName(n.previous_best_month)} (${money(n.previous_best)})`;
  case "growth_streak_3": return b.earned ? n.months.map(monthName).join(", ") : "";
  case "new_source": return `${n.source}${n.manual ? ", added by you" : ""}, first income ${dateShort(b.earned_on)}`;
  case "five_sources": return `${n.count} sources now; the 5th was ${n.fifth}`;
  case "new_currency": return `${n.currency} on ${dateShort(n.first_date)}, after ${n.earlier_currencies.join(" and ")}`;
  case "total_10k": return `${money(n.total_usd)} in total; passed $10,000 on ${dateShort(b.earned_on)}`;
  case "complete_month": return `${monthName(n.month)}: all ${n.platforms} platforms imported`; } return ""; };
const leftOf = b => !b.progress ? "" : b.progress.unit === "months" ? `${b.progress.current} of ${b.progress.target} months up in a row`
  : b.progress.unit === "sources" ? `${b.progress.current} of ${b.progress.target} sources` : `${money(b.progress.current)} of ${money0(b.progress.target)}`;
function W14(m) {
  const o = R.months[m], g = R.goal.months.find(x => x.month === m);
  const badges = R.badges[m].map(b => ({ ...b, key: BCOPY[b.id], art: R.art[b.id], reason: reasonOf(b), left: leftOf(b), date_label: b.earned_on ? dateLong(b.earned_on) : "" }));
  const latest = badges.filter(b => b.earned).sort((x, y) => x.earned_on.localeCompare(y.earned_on)).pop();
  return { ...o, badges, latest, goal: { amount: R.goal.amount, month: m, net: g.income, reached: g.reached, reached_on: g.reached_on, remaining: g.remaining } };
}
const youTag = () => `<span class="sa-you">${icon("pencil", "sm")}Added by you</span>`;
const goalCard = g => g.reached
  ? `<section class="sa-card sa-goal reached"><div><div class="label">${icon("target", "sm")} ${monthName(g.month)} goal · reached ${dateShort(g.reached_on)}</div>
      <h3>${Y.GOAL_REACHED_TITLE.replace("{month}", monthName(g.month))}</h3>
      <p>${Y.GOAL_REACHED_BODY.replace("{net}", `<b class="num">${money(g.net)}</b>`).replace("{goal}", money0(g.amount))}</p>
      <div class="sa-progress"><i style="width:100%"></i></div><div class="note"><span class="num">${Y.GOAL_REACHED_NOTE.replace("{over}", money(g.net - g.amount)).replace("{goal}", money0(g.amount))}</span><a href="#goal-sheet">Change goal</a></div></div>
      <img class="sa-mascot" src="${R.art.goal}" alt=""></section>`
  : `<section class="sa-card sa-goal"><div class="top"><div class="label">${icon("target", "sm")} ${monthName(g.month)} goal</div><span class="sa-badge sim num">${pct(g.net / g.amount)}</span></div>
      <div class="fig num">${money(g.net)}<small>of ${money0(g.amount)}</small></div>
      <div class="sa-progress"><i style="width:${Math.min(100, g.net / g.amount * 100).toFixed(1)}%"></i></div>
      <div class="note"><span>${Y.GOAL_SHORT.replace("{left}", `<b class="num">${money(g.remaining)}</b>`).replace("{goal}", money0(g.amount))}</span><a href="#goal-sheet">Change goal</a></div></section>`;
const latestCard = b => `<section class="sa-card sa-latest"><img class="sa-mascot" src="${b.art}" alt="">
  <div><div class="label">${Y.LATEST_BADGE} · ${dateShort(b.earned_on)}</div><b>${Y[b.key + "_NAME"]}</b></div><a href="#milestones">All ${icon("chevron", "sm rot")}</a></section>`;

/* ---------------- 20 · Overview v1.4 (income first, then expenses, goal and latest badge); 22b reached ---------------- */
function overviewV14(m) {
  const W = W14(m), I = W.income, E = W.expenses;
  const srcs = [...I.sources].sort((a, b) => b.net - a.net), own = srcs.filter(x => x.own);
  const maxCat = Math.max(...E.by_category.map(c => c.amount));
  return `
  <div class="sa-top"><div><h1>Overview</h1></div><div class="right">${periodSeg(monthName(m).slice(0, 3))}${you()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c7">
      <div class="orb"></div>
      <img class="sa-mascot hero-mascot" src="../02-logos/mascot/wave.png" alt="">
      <div class="lead">${C.OVERVIEW_HERO.replace("{month}", monthName(m))}</div>
      <div class="sa-fig num">${money(I.net)}</div>
      <div class="sub">from <b class="num">${money(I.gross)}</b> gross across ${srcs.length} sources</div>
      <div class="chips">
        <span class="glass">${icon(I.mom.change >= 0 ? "up" : "down", "sm")} ${money(I.mom.change)} vs ${monthName(W.prev_month)} (${I.mom.change >= 0 ? "+" : ""}${pct(I.mom.pct)})</span>
        <span class="glass">${icon("pencil", "sm")} ${money(own.reduce((t, x) => t + x.net, 0))} from ${own.length} source${own.length === 1 ? "" : "s"} you added</span>
      </div>
    </section>
    <div class="c5 stack">${goalCard(W.goal)}${latestCard(W.latest)}</div>
    <section class="sa-card c7">
      <div class="head"><h2>Income by source</h2><span class="meta">net · share of net</span></div>
      <div class="sa-bar">${srcs.map(x => `<span title="${x.label}" class="${x.own ? "own" : ""}" style="width:${(x.net / I.net * 100).toFixed(2)}%;${x.own ? "" : `background:${PCOL(x.key).fill}`}"></span>`).join("")}</div>
      <ul class="sa-legend">${srcs.map(x => `<li>${x.own ? `<span class="dot round" style="background:transparent;box-shadow:inset 0 0 0 2px var(--sa-accent-text)"></span>` : PICON(x.key)}<span>${x.label}${x.own ? youTag() : ""}</span><span class="amt">${money(x.net)}</span><span class="pct">${pct(x.net / I.net)}</span></li>`).join("")}</ul>
    </section>
    <section class="sa-card c5">
      <div class="head"><h2>Expenses by category</h2><span class="meta">${E.count} entries</span></div>
      <ul class="sa-catbars">${E.by_category.map(c => `<li><span>${c.category}</span><span class="amt">${money(-c.amount)}</span><span class="track"><i style="width:${(c.amount / maxCat * 100).toFixed(1)}%"></i></span></li>`).join("")}</ul>
      <div class="sa-kept"><ul><li><span>Net income</span><span>${money(I.net)}</span></li><li><span>Your expenses</span><span>${money(-E.total)}</span></li><li class="total"><span>Kept after expenses</span><span>${money(W.kept)}</span></li></ul></div>
      <div class="meta" style="margin-top:8px">${Y.KEPT_NOTE}</div>
    </section>
  </div>`;
}

/* ---------------- 19 · Ledger v1.4 (statements, your income, your expenses) ---------------- */
function ledgerV14() {
  const L = R.ledger, t = L.totals, m = R.show;
  const cell = (v, cls) => !v ? `<td class="money zero">—</td>` : `<td class="money ${cls}">${money(-v)}</td>`;
  const orig = r => r.original.currency === "USD" ? `<span class="meta">USD</span>`
    : `${r.original.currency === "CNY" ? cny(r.original.amount) : "€" + r.original.amount.toLocaleString("en-US", { minimumFractionDigits: 2 })}<span class="fx">${r.fx_line}</span>`;
  const row = r => {
    const d = `<td class="num">${r.date.slice(5).replace("-", "/")}</td>`;
    if (r.kind === "expense") return `<tr class="expense">${d}<td><i class="sa-pdot exp"></i>${r.label}${youTag()}</td><td>Expense<span class="sub">${r.ref}</span></td><td class="num">${orig(r)}</td><td class="money zero">—</td><td class="money zero">—</td><td class="money zero">—</td><td class="money exp">${money(-r.amount_usd)}</td></tr>`;
    const dot = r.kind === "statement" ? `${PICON(r.key)}` : `<i class="sa-pdot own"></i>`;
    return `<tr>${d}<td>${dot}${r.label}${r.kind === "income" ? youTag() : ""}</td><td>${r.type}${r.ref ? `<span class="sub">${r.ref}</span>` : ""}</td><td class="num">${orig(r)}</td>
      <td class="money">${money(r.gross)}</td>${cell(r.fees, "fee")}${cell(r.withheld, "tax")}<td class="money net">${money(r.net)}</td></tr>`;
  };
  return `
  <div class="sa-top"><div><h1>Ledger</h1></div>
    <div class="right"><a class="sa-btn secondary sm">${icon("upload", "sm")} Add statements</a><a class="sa-btn primary sm" href="#entry-expense">${icon("plus", "sm")} Add entry</a>${periodSeg("Sep")}</div></div>
  <div class="sa-kpirow">
    ${[["Gross income", t.gross, ""], ["Fees", -t.fees, "var(--sa-fee-text)"], ["Tax withheld", -t.withheld, "var(--sa-tax-text)"], ["Your expenses", -t.expenses, ""], ["Kept after expenses", t.kept, "var(--sa-forest)"]]
      .map(([l, v, c]) => `<div class="sa-card sa-kpi"><div class="label">${l}</div><div class="sa-fig num" style="${c ? `color:${c}` : ""}">${money(v)}</div></div>`).join("")}
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px">
    <span class="sa-chip on">All <span class="n">${L.counts.all}</span></span><span class="sa-chip">${icon("up", "sm")} Income <span class="n">${L.counts.income}</span></span><span class="sa-chip">${icon("down", "sm")} Expenses <span class="n">${L.counts.expenses}</span></span>
    <span class="meta" style="margin-left:12px;display:flex;gap:6px;align-items:center">${youTag()} ${L.counts.own} entries this month</span>
    <span style="margin-left:auto" class="sa-btn secondary sm">${icon("filter", "sm")} Source</span><span class="sa-btn secondary sm">${icon("download", "sm")} CSV</span>
  </div>
  <div class="sa-tablewrap"><table class="sa-table dense">
    <thead><tr><th>Date</th><th>Source</th><th>Type</th><th>Original</th><th class="money">Gross</th><th class="money">Fees</th><th class="money">Withheld</th><th class="money">Net</th></tr></thead>
    <tbody>${L.rows.map(row).join("")}
      <tr class="total"><td colspan="4">${monthName(m)} total · net income ${money(t.net)}, kept after expenses ${money(t.kept)}</td><td class="money">${money(t.gross)}</td><td class="money">${money(-t.fees)}</td><td class="money">${money(-t.withheld)}</td><td class="money">${money(t.net_after_expenses)}</td></tr>
    </tbody></table></div>`;
}

/* ---------------- 18 · Add entry sheet (over the Ledger): 18 expense, 18b income ---------------- */
function entrySheet(kind) {
  const ex = R.entry_examples[kind];
  const CATS = ["Software & subscriptions", "Equipment", "Internet & phone", "Education", "Travel", "Marketing", "Other"];
  const field = (label, ctl, help = "") => `<div class="sa-field"><span class="label">${label}</span>${ctl}${help ? `<span class="help">${help}</span>` : ""}</div>`;
  const sym = { USD: "$", CNY: "¥", EUR: "€" }[ex.currency];
  return ledgerV14() + `<div class="sa-drawer-backdrop"></div>
  <aside class="sa-drawer" role="dialog" aria-label="Add entry">
    <div class="head"><div><h2>Add entry</h2><p>${Y.ENTRY_SUB}</p></div><button class="sa-btn secondary sm">Close</button></div>
    <div class="sa-seg wide"><button class="${kind === "income" ? "on" : ""}">${icon("up", "sm")} Income</button><button class="${kind === "expense" ? "on" : ""}">${icon("down", "sm")} Expense</button></div>
    <div class="sa-row2">${field("Date", `<div class="ctl">${icon("calendar", "sm")} ${dateLong(ex.date)}</div>`)}${field("Currency", `<div class="ctl">${ex.currency}<span class="end">${icon("chevron", "sm")}</span></div>`)}</div>
    ${field("Amount", `<div class="ctl big focus"><span class="pre">${sym}</span><span class="num">${ex.amount.toLocaleString("en-US", { minimumFractionDigits: 2 })}</span></div>`)}
    ${kind === "income"
      ? field("Source", `<div class="ctl">${ex.source}</div>`, Y.SOURCE_HINT) + `<div class="sa-cats">${R.own_sources.map(x => `<span class="sa-chip ${x === ex.source ? "on" : ""}"><i class="sa-pdot own" style="margin-right:2px"></i>${x}</span>`).join("")}<span class="sa-chip">${icon("plus", "sm")} New source</span></div>`
      : field("Category", `<div class="sa-cats">${CATS.map(c => `<span class="sa-chip ${c === ex.category ? "on" : ""}">${c}</span>`).join("")}</div>`, Y.CATEGORY_HINT)}
    ${field("Note · optional", `<div class="ctl area" style="color:var(--sa-ink)">${kind === "expense" ? ex.source : "Add a note"}</div>`, `${icon("lock", "sm")} ${Y.NOTE_PRIVACY}`)}
    <div class="foot"><a class="sa-btn primary">${icon("plus", "sm")} Add ${kind}</a><a class="sa-btn ghost">Cancel</a></div>
  </aside>`;
}

/* ---------------- 21 · Milestones (utility link in the sidebar; the latest badge also sits on Overview) ---------------- */
function milestones() {
  const W = W14(R.show), earned = W.badges.filter(b => b.earned), b0 = W.latest;
  return `
  <div class="sa-top"><div><h1>Milestones</h1><p>${Y.MILESTONES_SUB}</p></div><div class="right">${you()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c12" style="min-height:0;display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding-top:24px;padding-bottom:24px">
      <div><div class="lead">${Y.LATEST_BADGE} · ${b0.date_label}</div>
        <div class="sa-fig num" style="font-size:44px;margin:10px 0 8px">${earned.length} of ${W.badges.length} earned</div>
        <div class="sub">${Y[b0.key + "_NAME"]}</div></div>
      <img class="sa-mascot" src="${b0.art}" alt="" style="height:var(--sa-mascot-hero);position:relative">
    </section>
    <div class="c12 sa-badgegrid">${W.badges.map(b => `<div class="sa-badgetile ${b.earned ? "" : "locked"} ${b === b0 ? "latest" : ""}">
      ${b.earned ? "" : `<span class="lock">${icon("lock", "sm")}</span>`}
      <div class="art"><img src="${b.art}" alt=""></div>
      <b>${Y[b.key + "_NAME"]}</b><span class="d">${Y[b.key + "_DESC"]}</span>
      ${b.earned ? `<div class="why">Earned ${b.date_label}</div>`
        : `<div class="why">${b.left}<div class="sa-progress"><i style="width:${(b.progress.current / b.progress.target * 100).toFixed(1)}%"></i></div></div>`}
    </div>`).join("")}</div>
  </div>`;
}

/* ---------------- 22 · Set monthly goal sheet (over Overview, August) ---------------- */
function goalSheet() {
  const amt = R.goal.amount;
  return overviewV14("2026-08") + `<div class="sa-drawer-backdrop"></div>
  <aside class="sa-drawer" role="dialog" aria-label="Set a monthly goal">
    <div class="head"><div><h2>Set a monthly goal</h2><p>${Y.GOAL_SHEET_SUB}</p></div><button class="sa-btn secondary sm">Close</button></div>
    <div class="sa-field"><span class="label">Goal per month</span><div class="ctl big focus"><span class="pre">$</span><span class="num">${amt.toLocaleString("en-US")}</span><span class="end" style="font:600 14px/1 var(--sa-font)">net income</span></div></div>
    <div class="sa-seg wide" style="grid-template-columns:repeat(4,1fr)">${R.goal_presets.map(v => `<button class="${v === amt ? "on" : ""}">${money0(v)}</button>`).join("")}</div>
    <section class="sa-card" style="padding:16px 18px">
      <div class="label" style="margin-bottom:6px">Your last ${R.goal.months.length} months at ${money0(amt)}</div>
      <ul class="sa-catbars">${R.goal.months.map(x => `<li><span>${monthName(x.month)}</span><span class="amt">${money(x.income)} ${x.reached ? `<span class="sa-badge ok">${icon("check", "sm")} reached</span>` : `<span class="sa-badge sim">${pct(x.progress)}</span>`}</span><span class="track"><i style="width:${Math.min(100, x.progress * 100).toFixed(1)}%;background:var(--sa-forest)"></i></span></li>`).join("")}</ul>
    </section>
    <div class="foot"><a class="sa-btn primary">${icon("target", "sm")} Save goal</a><a class="sa-btn ghost">Cancel</a></div>
  </aside>`;
}
const overviewV14p = () => overviewV14("2026-08"), overviewV14r = () => overviewV14("2026-09");
const entryExpense = () => entrySheet("expense"), entryIncome = () => entrySheet("income");

const RENDER = { overview, ledger, tax, ask, report, sources, settings, missing,
  "mydata-empty": mydataEmpty, mydata, privacy, "tax-cn": taxCn, "overview-cny": overviewCny,
  "privacy-delete": privacyDelete, "tax-both": taxBoth, "overview-empty": overviewEmpty, "ledger-cny": ledgerCny, "ledger-cny-file": ledgerCnyFile,
  "entry-expense": entryExpense, "entry-income": entryIncome, "ledger-v14": ledgerV14, "overview-v14": overviewV14p, milestones, "goal-sheet": goalSheet, "goal-reached": overviewV14r };
const NAV_OF = { sources: "ledger", settings: "tax", report: "tax", missing: "overview", "mydata-empty": "mydata", "tax-cn": "tax", "overview-cny": "overview",
  "privacy-delete": "privacy", "tax-both": "tax", "overview-empty": "overview", "ledger-cny": "ledger", "ledger-cny-file": "ledger",
  "entry-expense": "ledger", "entry-income": "ledger", "ledger-v14": "ledger", "overview-v14": "overview", "goal-sheet": "overview", "goal-reached": "overview" };
const YOURS = new Set(["mydata-empty", "mydata", "privacy", "tax-cn", "overview-cny", "privacy-delete", "tax-both", "overview-empty", "ledger-cny", "ledger-cny-file",
  "entry-expense", "entry-income", "ledger-v14", "overview-v14", "milestones", "goal-sheet", "goal-reached"]);
const NO_DATA = new Set(["mydata-empty", "overview-empty"]); // Your data mode before any import
const V14_SCREENS = new Set(["entry-expense", "entry-income", "ledger-v14", "overview-v14", "milestones", "goal-sheet", "goal-reached"]);
const YOURS_HREF = { overview: "overview-cny", ledger: "ledger-cny", tax: "tax-cn" }; // in Your data mode the nav opens the v1.3 drawings
const V14_HREF = { overview: "overview-v14", ledger: "ledger-v14", tax: "tax-cn" }; // and the v1.4 drawings from v1.4 screens
function go() {
  const q = new URLSearchParams(location.search).get("screen");
  const s = (q || location.hash.slice(1) || "overview");
  const key = RENDER[s] ? s : "overview";
  const navKey = NAV_OF[key] || key;
  const yours = YOURS.has(key);
  document.getElementById("mode").innerHTML = `<a href="#mydata" class="${yours ? "on" : ""}">${icon("lock", "sm")}Your data</a><a href="#overview" class="${yours ? "" : "on"}">Demo data</a>`;
  document.getElementById("nav").innerHTML = NAV.map(([k, label, ic]) =>
    `<a href="#${(yours && (NO_DATA.has(key) ? (k === "overview" ? "overview-empty" : "") : (V14_SCREENS.has(key) ? V14_HREF : YOURS_HREF)[k])) || k}" class="${k === navKey ? "on" : ""}">${icon(ic)}${label}</a>`).join("");
  document.getElementById("util").innerHTML = UTIL.map(([k, label, ic]) =>
    `<a href="#${k}" class="${k === navKey ? "on" : ""}">${icon(ic)}${label}${k === "mydata" && yours && !NO_DATA.has(key) ? `<span class="r">${V.files.length} files</span>` : ""}${k === "milestones" && yours && !NO_DATA.has(key) ? `<span class="r">${R.badges[R.show].filter(b => b.earned).length} of ${R.badges[R.show].length}</span>` : ""}</a>`).join("");
  document.getElementById("prism").innerHTML = `<i></i>${yours ? "Content-free PRISM traces" : "Every run traced in PRISM"}`;
  document.getElementById("main").innerHTML = RENDER[key]();
  document.getElementById("main").scrollTop = 0;
  if (key === "settings") bindSettings();
}
document.getElementById("tagline").textContent = C.TAGLINE;
document.getElementById("disclaimer").textContent = C.DISCLAIMER;
window.addEventListener("hashchange", go);
document.addEventListener("DOMContentLoaded", go);
</script>
</body>
</html>
