<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1440">
<title>Side Atlas · prototype v1.3</title>
<link rel="icon" href="../02-logos/app-icons-and-favicons/favicon.svg">
<link rel="stylesheet" href="../05-css/side-atlas-ui-reference.css">
<script src="../03-icons/side-atlas-icons.js"></script>
<script src="data.js"></script>
<script src="data-v13.js"></script>
<script src="copy-v13.js"></script>
<script>
/* UI is single-language (English). Source data keeps "B站", Chinese record types and names; map them for display. */
(() => {
  const EXACT = {"充电":"Power-up","礼物":"Gift","SC":"Super Chat","舰长":"Captain (guard)","提督":"Admiral (guard)","总督":"Governor (guard)","提现代扣个税":"Tax withheld at withdrawal","平台代扣代缴":"Withheld and paid by the platform","大额单笔":"Large single payment"};
  const INLINE = [["B站","Bilibili"],["B 站","Bilibili"],["月之灵","Moon Spirit"],["小鹿","Xiao Lu"],["阿柚","A You"],["墨白","Mo Bai"]];
  const CJK = /[\u4e00-\u9fff]/;
  const en = (v, k) => {
    if (typeof v === "string") { let o = v in EXACT ? EXACT[v] : v; for (const [c, e] of INLINE) o = o.split(c).join(e); return CJK.test(o) && /profile|note|basis/.test(k) ? "" : o; }
    if (Array.isArray(v)) return v.map(x => en(x, k));
    if (v && typeof v === "object") return Object.fromEntries(Object.entries(v).map(([kk, x]) => [kk, en(x, kk)]));
    return v;
  };
  window.SA_DATA = en(window.SA_DATA, "");
})();
</script>
</head>
<body>
<div class="sa-app">
  <aside class="sa-side">
    <div class="sa-logo">
      <img class="mark" src="../02-logos/icon-256.png" alt="">
      <div><b>Side Atlas</b></div>
    </div>
    <div class="sa-mode" id="mode" aria-label="Data"></div>
    <nav class="sa-nav" id="nav"></nav>
    <div class="foot">
      <nav class="sa-util" id="util"></nav>
      <div class="tag" id="tagline"></div>
      <span class="sa-prism" id="prism"><i></i>Every run traced in PRISM</span>
      <div class="meta" id="disclaimer"></div>
    </div>
  </aside>
  <main class="sa-main" id="main"></main>
</div>

<script>
const D = window.SA_DATA, C = D.copy;
const PCOL = k => ({ fill: `var(--sa-p-${k})`, tint: `var(--sa-p-${k}-tint)`, text: `var(--sa-p-${k}-text)` });
const usd = v => (v < 0 ? "−" : "") + "$" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const usd0 = v => "$" + Math.round(v).toLocaleString("en-US");
const cny = v => "¥" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => (v * 100).toFixed(1) + "%";
const icon = (n, cls = "") => `<svg class="sa-icon ${cls}"><use href="#sa-i-${n}"/></svg>`;
const monthName = m => new Date(m + "-01T12:00:00").toLocaleString("en-US", { month: "long" });
const dateLong = d => new Date(d + "T12:00:00").toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric" });

/* v1.3 nav: exactly four screens (decision #23). My data and Settings & privacy are utility links in the
   sidebar foot; every other screen is a route reached from inside the four. */
const NAV = [["overview", "Overview", "overview"], ["ledger", "Ledger", "ledger"], ["tax", "Tax", "tax"], ["ask", "Ask Atlas", "ask"]];
const UTIL = [["mydata", "My data", "upload"], ["privacy", "Settings & privacy", "shield"]];
const V = window.SA_V13, X = window.SA_COPY_V13;
const yen = v => (v < 0 ? "−" : "") + "¥" + Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const dateShort = d => new Date(d + "T12:00:00").toLocaleString("en-US", { month: "short", day: "numeric" });

function who(name, cjk, meta) {
  return `<div class="sa-who"><div class="av">${cjk ? `<span class="cjk">${cjk}</span>` : name[0]}</div><div><b>${name}</b><span>${meta}</span></div></div>`;
}
function periodSeg(on) {
  return `<div class="sa-seg">${["Jul", "Aug", "Sep", "Q3 2026"].map(p => `<button class="${p === on ? "on" : ""}">${p}</button>`).join("")}</div>`;
}
const moon = () => who("Moon Spirit", "", "New York · US tax home · single-member LLC");

/* ---------------- Overview ---------------- */
function overview() {
  const o = D.overview_c01_sep, t = o.totals, mom = o.month_over_month;
  const wf = [
    ["Net", t.net, "var(--sa-net)"], ["Platform fees", t.platform_fee, "var(--sa-fee)"],
    ["Payout & payment fees", t.payout_fee, "var(--sa-payout)"], ["Tax withheld by platforms", t.withheld, "var(--sa-tax)"]];
  const plats = [...o.platforms].sort((a, b) => b.net - a.net);
  return `
  <div class="sa-top"><div><h1>Overview</h1><p>September 2026 · ${o.platforms.length} platforms · 2 currencies</p></div>
    <div class="right">${periodSeg("Sep")}${moon()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c7">
      <div class="orb"></div>
      <div class="lead">${C.OVERVIEW_HERO.replace("{month}", "September")}</div>
      <div class="sa-fig num">${usd(t.net)}</div>
      <div class="sub">from <b class="num">${usd(t.gross)}</b> gross across ${o.platforms.length} platforms</div>
      <div class="chips">
        <span class="glass">${icon("up", "sm")} ${usd(mom.change)} vs August (${mom.change_pct > 0 ? "+" : ""}${pct(mom.change_pct)})</span>
        <span class="glass">${icon("fx", "sm")} CNY converted at each record’s own date</span>
      </div>
    </section>
    <div class="c5 stack">
      <div class="sa-card sa-kpi"><div class="label">${icon("tax", "sm")} Set aside at your ${Math.round(o.set_aside.rate * 100)}%</div>
        <div class="sa-fig forest num">${usd(o.set_aside.amount)}</div>
        <div class="note">Next US estimated tax: <b>Jan 15, 2027</b> · 90 days</div></div>
      <div class="sa-card sa-kpi"><div class="label">${icon("check", "sm")} Keeps the most of each dollar</div>
        <div style="display:flex;align-items:baseline;justify-content:space-between;margin-top:10px">
          <div class="sa-fig num" style="margin:0">${o.best_keep_rate.label}</div><span class="sa-badge ok">${pct(o.best_keep_rate.net_rate)} kept</span></div>
        <div class="note" style="margin-top:6px">Lowest: Bilibili keeps ${pct(o.platforms.find(p => p.platform === "bilibili").net_rate)} after its 50% share</div></div>
    </div>
    <section class="sa-card c7">
      <div class="head"><h2>Where the gross went</h2><span class="meta num">${usd(t.gross)} gross</span></div>
      <div class="sa-bar">${wf.map(([l, v, c]) => `<span title="${l}" style="width:${(v / t.gross * 100).toFixed(2)}%;background:${c}"></span>`).join("")}</div>
      <ul class="sa-legend">
        <li><span class="dot" style="background:var(--sa-line-strong)"></span><span>Gross income</span><span class="amt">${usd(t.gross)}</span><span class="pct">100%</span></li>
        ${wf.slice(1).map(([l, v, c]) => `<li><span class="dot" style="background:${c}"></span><span>${l}</span><span class="amt">${usd(-v)}</span><span class="pct">${pct(v / t.gross)}</span></li>`).join("")}
        <li class="total"><span class="dot" style="background:var(--sa-net)"></span><span>Net — what landed</span><span class="amt">${usd(t.net)}</span><span class="pct">${pct(t.net / t.gross)}</span></li>
      </ul>
    </section>
    <section class="sa-card c5">
      <div class="head"><h2>By platform</h2><span class="meta">share of net</span></div>
      <div class="sa-bar">${plats.map(p => `<span title="${p.label}" style="width:${(p.share_of_net * 100).toFixed(2)}%;background:${PCOL(p.platform).fill}"></span>`).join("")}</div>
      <ul class="sa-legend">${plats.map(p => `<li><span class="dot" style="background:${PCOL(p.platform).fill};border-radius:50%"></span><span>${p.label}</span><span class="amt">${usd(p.net)}</span><span class="pct">${pct(p.net_rate)} kept</span></li>`).join("")}</ul>
    </section>
  </div>`;
}

/* ---------------- Ledger ---------------- */
function ledger() {
  const L = D.ledger_c01_sep, t = L.totals;
  const rows = [...L.rows].sort((a, b) => a.date.localeCompare(b.date) || a.platform.localeCompare(b.platform));
  const cell = (v, cls) => `<td class="money ${v === 0 ? "zero" : cls}">${v === 0 ? "—" : usd(cls === "net" ? v : -v)}</td>`;
  return `
  <div class="sa-top"><div><h1>Ledger</h1><p>${C.LEDGER_INTRO}</p></div><div class="right">${periodSeg("Sep")}${moon()}</div></div>
  <div class="sa-kpirow">
    ${[["Gross", t.gross, ""], ["Platform fees", -t.platform_fee, "var(--sa-fee-text)"], ["Payout fees", -t.payout_fee, "var(--sa-payout-text)"], ["Tax withheld", -t.withheld, "var(--sa-tax-text)"], ["Net", t.net, "var(--sa-forest)"]]
      .map(([l, v, c]) => `<div class="sa-card sa-kpi"><div class="label">${l}</div><div class="sa-fig num" style="${c ? `color:${c}` : ""}">${usd(v)}</div></div>`).join("")}
  </div>
  <div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
    <span class="sa-chip on">All · ${rows.length} records</span>
    ${D.overview_c01_sep.platforms.map(p => `<span class="sa-chip"><i class="dot" style="background:${PCOL(p.platform).fill}"></i>${p.label}</span>`).join("")}
    <span style="margin-left:auto" class="sa-btn secondary sm">${icon("filter", "sm")} Type</span>
    <span class="sa-btn secondary sm">${icon("download", "sm")} CSV</span>
  </div>
  <div class="sa-tablewrap"><table class="sa-table dense">
    <thead><tr><th>Date</th><th>Platform</th><th>Type</th><th>Original</th><th class="money">Gross</th><th class="money">Platform fee</th><th class="money">Payout fee</th><th class="money">Withheld</th><th class="money">Net</th></tr></thead>
    <tbody>${rows.map(r => `<tr>
      <td class="num">${r.date.slice(5).replace("-", "/")}</td>
      <td><i class="sa-pdot" style="background:${PCOL(r.platform).fill}"></i>${r.platform_label}</td>
      <td>${r.type}${r.ref ? `<span class="sub">${r.ref}</span>` : ""}</td>
      <td class="num">${r.original.currency === "USD" ? `<span class="meta">USD</span>` : `${cny(r.original.gross)}<span class="fx">÷ ${r.fx.rate.toFixed(4)} · ${r.fx.rate_date}</span>`}</td>
      <td class="money">${usd(r.gross_usd)}</td>${cell(r.platform_fee_usd, "fee")}${cell(r.payout_fee_usd, "payout")}${cell(r.withheld_usd, "tax")}<td class="money net">${usd(r.net_usd)}</td></tr>`).join("")}
      <tr class="total"><td colspan="4">September total</td><td class="money">${usd(t.gross)}</td><td class="money">${usd(-t.platform_fee)}</td><td class="money">${usd(-t.payout_fee)}</td><td class="money">${usd(-t.withheld)}</td><td class="money">${usd(t.net)}</td></tr>
    </tbody></table></div>`;
}

/* ---------------- Tax items (hero) ---------------- */
const STATUS = {
  not_applicable: `<span class="sa-badge tax">CN tax record</span>`,
  over_so_far: `<span class="sa-badge sim">1099-MISC likely</span>`,
  projected_over: `<span class="sa-badge sim">1099-MISC projected</span>`,
  below: `<span class="sa-badge sim">Below 1099-K threshold</span>`,
};
function tax() {
  const T = D.tax_c01_q3, F = D.forms_c01_q3, tot = F.totals, P = D.forms_c12_fiverr;
  const w = T.tax_withheld_by_platform[0];
  const gapBar = f => {
    const g = f.gap || 0, it = f.gap_items;
    if (!g) return `<span class="meta">${f.form_view === null ? "— no US form" : "no gap"}</span>`;
    return `<div style="display:flex;align-items:center;gap:10px"><div class="sa-gap">${[[it.platform_fees, "var(--sa-fee)"], [it.payout_fees, "var(--sa-payout)"], [it.tax_withheld, "var(--sa-tax)"], [it.refunds, "var(--sa-line-strong)"]]
      .map(([v, c]) => v > 0 ? `<span style="width:${Math.max(4, v / g * 100)}%;background:${c}"></span>` : "").join("")}</div><span class="num">${usd(-g)}</span></div>`;
  };
  return `
  <div class="sa-top"><div><h1>Tax items</h1><p>Q3 2026 · July–September</p></div><div class="right">${periodSeg("Q3 2026")}${moon()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c8" style="display:grid;grid-template-columns:1fr 210px;gap:24px;min-height:220px">
      <div>
        <div class="lead" style="font:800 30px/1.15 var(--sa-font);color:var(--sa-on-forest);letter-spacing:-.02em">${C.TAX_HERO}</div>
        <div class="sub" style="margin-top:10px;max-width:470px">${C.TAX_SUB}</div>
        <div style="margin-top:20px;position:relative">
          <div class="sa-fig num" style="margin:0 0 6px;font-size:48px">${usd(T.set_aside.amount)}</div>
          <div class="sub">to set aside: ${usd(T.total_net_usd)} Q3 net × the 25% you chose</div>
        </div>
      </div>
      <div class="sa-count" style="align-self:end">
        <div class="days num">${T.next_us_estimated_tax_due.days_left}</div>
        <div class="of">days to the next US<br>estimated-tax payment</div>
        <div class="glass" style="margin-top:12px">${icon("calendar", "sm")} ${dateLong(T.next_us_estimated_tax_due.due_date)}</div>
      </div>
    </section>
    <section class="sa-card c4">
      <div class="head"><h2>Tax already withheld</h2></div>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
        <div><span class="sa-badge tax">${icon("globe", "sm")} China · ${w.platform}</span>
          <div class="meta" style="margin-top:8px">Individual income tax, withheld by the platform</div></div>
        <div style="text-align:right"><div class="sa-fig num" style="font:800 28px/1 var(--sa-font);color:var(--sa-tax-text)">${usd(w.withheld_usd)}</div><div class="meta num">${cny(w.withheld_cny)}</div></div>
      </div>
      <div class="sa-note info" style="margin-top:16px">${icon("info", "sm")}<span>Nothing was withheld on Contra, Fiverr, Patreon, Twitch, Upwork or YouTube. The set-aside covers that income.</span></div>
    </section>
    <section class="sa-card c12">
      <div class="head"><div><h2>${C.FORMS_HEADLINE}</h2><div class="mid" style="margin-top:6px;max-width:820px">${C.FORMS_SUB}</div></div></div>
      <div class="sa-note info" style="margin-bottom:14px;font-size:14px">${icon("check", "sm")}<span>${C.THRESHOLD_BANNER}</span></div>
      <div class="sa-tablewrap"><table class="sa-table">
        <thead><tr><th>Platform</th><th>Form (simulated)</th><th>Paid out to</th><th class="money">Form view</th><th class="money">Bank view</th><th>${C.GAP_LABEL}</th><th class="money">Txns</th><th>Status</th></tr></thead>
        <tbody>${F.rows.map(f => `<tr>
          <td><i class="sa-pdot" style="background:${PCOL(f.platform).fill}"></i><b>${f.label}</b></td>
          <td>${f.form === "none" ? `<span class="sa-badge tax">No US form</span>` : `<span class="sa-badge sim">${f.form}</span>`}</td>
          <td>${f.payout_method === "PayPal" ? `<b>PayPal</b>` : `<span class="meta">${f.payout_method}</span>`}</td>
          <td class="money">${f.form_view === null ? `<span class="meta">—</span>` : usd(f.form_view)}</td><td class="money net">${usd(f.bank_view)}</td>
          <td>${gapBar(f)}</td>
          <td class="money">${f.transactions}</td>
          <td><div style="display:flex;gap:6px;flex-wrap:wrap">${STATUS[f.status] || ""}${f.duplicate ? `<span class="sa-badge warn">${icon("duplicate", "sm")} Possible duplicate</span>` : ""}</div></td></tr>`).join("")}
          <tr class="total"><td colspan="3">Platforms with US forms</td><td class="money">${usd(tot.form_view_gross_usd)}</td><td class="money">${usd(tot.bank_view_landed_usd)}</td><td><span class="num">${usd(-tot.gap_usd)}</span></td><td></td><td></td></tr>
        </tbody></table></div>
      <div class="meta" style="margin-top:10px;display:flex;gap:6px;align-items:center">${icon("info", "sm")} ${C.SIMULATED_NOTE} 1099-MISC status uses a simulated $2,000 example threshold.</div>
      <div class="sa-grid" style="margin-top:12px;gap:12px">
        <div class="sa-note warn c7">${icon("duplicate", "sm")}<span>${C.DUPLICATE_NOTE_FIVERR}</span></div>
        <div class="sa-note info c5">${icon("info", "sm")}<span>${C.CONTRAST_PRIYA} <span class="num">(${P.transactions} transactions)</span></span></div>
      </div>
    </section>
    <section class="sa-card c12" style="display:grid;grid-template-columns:1fr auto;gap:24px;align-items:start">
      <div><div class="head"><h2>For your accountant</h2></div>
        <ul class="sa-check">${T.items_for_accountant.map((x, i) => `<li><span class="box ${i === 1 ? "done" : ""}"></span><span>${x}</span></li>`).join("")}
          <li><span class="box"></span><span>Fiverr pays out to PayPal: check the Fiverr and PayPal 1099-Ks for the same income.</span></li>
          <li><span class="box"></span><span>Keep this forms-vs-bank reconciliation (gap ${usd(tot.gap_usd)}: platform fees and payout fees) with your records.</span></li></ul></div>
      <a class="sa-btn primary">${icon("download", "sm")} Export for my accountant</a>
    </section>
  </div>`;
}

/* ---------------- Ask ---------------- */
function ask() {
  const A = D.ask_example, o = D.overview_c01_sep, t = o.totals;
  const lines = [["Gross income", t.gross, 10], ["Platform fees", -t.platform_fee, 10], ["Payout & payment fees", -t.payout_fee, 10], ["Tax withheld by Bilibili", -t.withheld, 10], ["Set aside at your 25%", o.set_aside.amount, 10]];
  return `
  <div class="sa-top"><div><h1>Ask</h1><p>The agent looks things up step by step; code does the math.</p></div><div class="right">${moon()}</div></div>
  <div class="sa-grid">
    <div class="c7 stack">
      <div class="sa-bubble">${A.question}</div>
      <section class="sa-hero sa-answer" style="min-height:0">
        <div class="lead">You landed in September 2026</div>
        <div class="sa-fig num">${usd(t.net)}<span class="sa-ref">11</span></div>
        <div class="sub">out of ${usd(t.gross)} gross across 7 platforms. Contra kept the most of each dollar (100%), <span class="num">Bilibili</span> the least (${pct(o.platforms.find(p => p.platform === "bilibili").net_rate)}).</div>
      </section>
      <section class="sa-card" style="padding:18px 24px">
        <ul class="sa-lines">${lines.map(([l, v, s]) => `<li><span>${l}</span><span class="amt">${usd(v)}<span class="sa-ref light">${s}</span></span></li>`).join("")}</ul>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px">
          <span class="meta" style="display:flex;gap:6px;align-items:center;color:var(--sa-forest)">${icon("check", "sm")} ${C.ASK_PROMISE}</span>
          <span class="sa-prism"><i></i>Traced in PRISM ${icon("external", "sm")}</span>
        </div>
      </section>
      <div class="sa-input"><span>${C.ASK_PLACEHOLDER}</span><a class="sa-btn primary sm">${icon("send", "sm")} Ask</a></div>
    </div>
    <section class="sa-card c5">
      <div class="head"><h2>Agent steps</h2><span class="sa-badge ok">${A.trace.steps} tool calls</span></div>
      <ol class="sa-steps">${A.steps.map((s, i) => `<li class="${i === A.steps.length - 1 ? "final" : ""}"><span class="n">${i + 1}</span><div><div class="t">${s.tool}<span class="meta" style="font-family:var(--sa-font)"> · ${s.args}</span></div><div class="s">${s.summary}</div></div>${icon("check", "sm")}</li>`).join("")}</ol>
    </section>
  </div>`;
}

/* ---------------- Report ---------------- */
function report() {
  const R = D.report_c01_q3, t = R.totals;
  return `
  <div class="sa-top"><div><h1>Report</h1><p>Hand this to your accountant. Every figure links back to the ledger.</p></div><div class="right">${periodSeg("Q3 2026")}${moon()}</div></div>
  <div class="sa-grid">
    <div class="c8 sa-sheet">
      <div class="band"><div class="label" style="color:var(--sa-on-forest-mid)">Side Atlas · Q3 2026 report</div><h1>${C.REPORT_COVER}</h1>
        <div class="meta">Moon Spirit · US tax home · single-member LLC · prepared Oct 17, 2026</div></div>
      <div class="body">
        <div class="sa-totals">${[["Gross", t.gross], ["Platform fees", -t.platform_fee], ["Payout fees", -t.payout_fee], ["Tax withheld", -t.withheld]].map(([l, v]) => `<div><span class="label">${l}</span><b>${usd(v)}</b></div>`).join("")}<div class="net"><span class="label">Net</span><b>${usd(t.net)}</b></div></div>
        <h3>By month</h3>
        <table class="sa-table"><thead><tr><th>Month</th><th class="money">Gross</th><th class="money">Platform fees</th><th class="money">Payout fees</th><th class="money">Tax withheld</th><th class="money">Net</th></tr></thead>
          <tbody>${R.by_month.map(m => `<tr><td>${monthName(m.month)}</td><td class="money">${usd(m.gross)}</td><td class="money fee">${usd(-m.platform_fee)}</td><td class="money payout">${usd(-m.payout_fee)}</td><td class="money tax">${usd(-m.withheld)}</td><td class="money net">${usd(m.net)}</td></tr>`).join("")}</tbody></table>
        <h3>Tax items</h3>
        <ul class="sa-lines"><li><span>Tax withheld by Bilibili (China)</span><span class="amt">${usd(R.tax.total_tax_withheld_usd)}</span></li>

function bindSettings() {
  const S = D.settings_c01, all = S.total_net;
  const amt = document.getElementById("sa-amt"), base = document.getElementById("sa-base"), note = document.getElementById("sa-note25");
  const slider = document.getElementById("sa-rate"), input = document.getElementById("sa-rate-in");
  const update = r => {
    r = Math.max(0, Math.min(100, Number(r) || 0));
    slider.value = Math.min(50, r); input.value = r;
    document.querySelectorAll("#sa-presets button").forEach(b => b.classList.toggle("on", Number(b.dataset.r) === r));
    let net = all;
    document.querySelectorAll(".sa-togglelist li").forEach(li => { if (!li.querySelector(".sa-toggle").classList.contains("on")) net -= Number(li.dataset.net); });
    const full = net === all && r === 25;
    amt.textContent = full ? usd(S.set_aside) : usd(Math.round(net * r) / 100);
    base.textContent = `= ${usd(net)} Q3 net × ${r}%`;
    note.style.visibility = full ? "visible" : "hidden";
  };
  slider.addEventListener("input", e => update(e.target.value));
  input.addEventListener("input", e => update(e.target.value));
  document.querySelectorAll("#sa-presets button").forEach(b => b.addEventListener("click", () => update(b.dataset.r)));
  document.querySelectorAll(".sa-toggle").forEach(t => t.addEventListener("click", () => { t.classList.toggle("on"); t.closest("li").classList.toggle("off"); update(input.value); }));
}

    <section class="sa-card c4">

        <div><span class="sa-badge tax">${icon("globe", "sm")} China · Bilibili</span>
          <div class="meta" style="margin-top:8px">Individual income tax, withheld by the platform</div></div>
        <div style="text-align:right"><div class="sa-fig num" style="font:800 28px/1 var(--sa-font);color:var(--sa-tax-text)">${yen(Q.bilibili.withheld)}</div><div class="meta num">${usd(usdW.withheld_usd)}</div></div>

      <div class="sa-note info" style="margin-top:16px">${icon("info", "sm")}<span>${X.CN_WITHHELD_NOTE}</span></div>

    <section class="sa-card c12">
      <div class="head"><h2>Income by where it was paid</h2><span class="meta">${X.CN_WINDOW_LABEL}</span></div>

/* ---------------- 14 · Overview in CNY ---------------- */
function overviewCny() {
  const S = V.cny_sep, t = S.totals, P = S.platforms, mom = V.cny_mom, ios = V.patreon_ios_sep;
  const plats = Object.entries(P).map(([k, p]) => ({ k, ...p })).sort((a, b) => b.net - a.net);
  const best = plats.reduce((a, b) => (b.kept > a.kept ? b : a));
  const wf = [["Platform fees", t.platform_fee, "var(--sa-fee)"], ["Payout & payment fees", t.payment_fee, "var(--sa-payout)"], ["Tax withheld by platforms", t.withheld, "var(--sa-tax)"]];
  const bar = [["Net", t.net, "var(--sa-net)"], ...wf];
  return `
  <div class="sa-top"><div><h1>Overview</h1><p>September 2026 · ${plats.length} platforms · shown in CNY</p></div><div class="right">${curSeg("CNY")}${periodSeg("Sep")}${you()}</div></div>
  <div class="sa-grid">
    <section class="sa-hero c7">
      <div class="orb"></div>
      <img class="sa-mascot hero-mascot" src="../02-logos/mascot/wave.png" alt="">
      <div class="lead">${C.OVERVIEW_HERO.replace("{month}", "September")}</div>
      <div class="sa-fig num">${yen(t.net)}</div>
      <div class="sub">from <b class="num">${yen(t.gross)}</b> gross across ${plats.length} platforms</div>
      <div class="chips">
        <span class="glass">${icon("up", "sm")} ${yen(mom.change)} vs August (+${pct(mom.pct)})</span>
        <span class="glass">${icon("fx", "sm")} USD converted at each record’s own date</span>
      </div>
    </section>
    <section class="sa-card c5">
      <div class="head"><h2>By platform</h2><span class="meta">net · kept of gross</span></div>
      <div class="sa-bar">${plats.map(p => `<span title="${p.label}" style="width:${(p.share * 100).toFixed(2)}%;background:${PCOL(p.k).fill}"></span>`).join("")}</div>
      <ul class="sa-legend">${plats.map(p => `<li class="${p === best ? "best" : ""}"><span class="dot round" style="background:${PCOL(p.k).fill}"></span><span>${p.label}${p === best ? `<span class="sa-badge sim">keeps the most</span>` : ""}</span><span class="amt">${yen(p.net)}</span><span class="pct">${pct(p.kept)}</span></li>`).join("")}</ul>
    </section>
    <section class="sa-card c7">
      <div class="head"><h2>Where the gross went</h2></div>
      <div class="sa-bar">${bar.map(([l, v, c]) => v > 0 ? `<span title="${l}" style="width:${(v / t.gross * 100).toFixed(2)}%;background:${c}"></span>` : "").join("")}</div>
      <ul class="sa-legend">
        <li><span class="dot" style="background:var(--sa-line-strong)"></span><span>Gross income</span><span class="amt">${yen(t.gross)}</span><span class="pct">100%</span></li>
        ${wf.map(([l, v, c]) => `<li><span class="dot" style="background:${c}"></span><span>${l}</span><span class="amt">${yen(-v)}</span><span class="pct">${pct(v / t.gross)}</span></li>`).join("")}
        <li class="total"><span class="dot" style="background:var(--sa-net)"></span><span>Net (what landed)</span><span class="amt">${yen(t.net)}</span><span class="pct">${pct(t.net / t.gross)}</span></li>
      </ul>
    </section>
    <div class="c5 stack">
      <section class="sa-card sa-kpi">
        <div class="label">${icon("info", "sm")} Patreon iOS · simulated</div>
        <div class="kpi-row"><div class="sa-fig num">${yen(-ios.cut_cny)}</div><span class="sa-badge sim">30% in-app cut</span></div>
        <div class="note">${yen(ios.pledges_cny)} of ${yen(P.patreon.gross)} in Patreon pledges came through iOS. Moving those patrons to web pledges keeps this.</div>
      </section>
      <a class="sa-card tax-link" href="#tax-cn">${icon("tax", "sm")}<span>Tax withheld in China and the annual filing window</span><b>Tax ${icon("chevron", "sm rot")}</b></a>
    </div>
  </div>`;
}

const RENDER = { overview, ledger, tax, ask, report, sources, settings, missing,
  "mydata-empty": mydataEmpty, mydata, privacy, "tax-cn": taxCn, "overview-cny": overviewCny };
const NAV_OF = { sources: "ledger", settings: "tax", report: "tax", missing: "overview", "mydata-empty": "mydata", "tax-cn": "tax", "overview-cny": "overview" };
const YOURS = new Set(["mydata-empty", "mydata", "privacy", "tax-cn", "overview-cny"]);
const YOURS_HREF = { overview: "overview-cny", tax: "tax-cn" }; // in Your data mode the nav opens the v1.3 drawings
function go() {
  const q = new URLSearchParams(location.search).get("screen");
  const s = (q || location.hash.slice(1) || "overview");
  const key = RENDER[s] ? s : "overview";
  const navKey = NAV_OF[key] || key;
  const yours = YOURS.has(key);
  document.getElementById("mode").innerHTML = `<a href="#mydata" class="${yours ? "on" : ""}">${icon("lock", "sm")}Your data</a><a href="#overview" class="${yours ? "" : "on"}">Demo data</a>`;
  document.getElementById("nav").innerHTML = NAV.map(([k, label, ic]) =>
    `<a href="#${(yours && YOURS_HREF[k]) || k}" class="${k === navKey ? "on" : ""}">${icon(ic)}${label}</a>`).join("");
  document.getElementById("util").innerHTML = UTIL.map(([k, label, ic]) =>
    `<a href="#${k}" class="${k === navKey ? "on" : ""}">${icon(ic)}${label}${k === "mydata" && yours && key !== "mydata-empty" ? `<span class="r">${V.files.length} files</span>` : ""}</a>`).join("");
  document.getElementById("prism").innerHTML = `<i></i>${yours ? "Content-free PRISM traces" : "Every run traced in PRISM"}`;
  document.getElementById("main").innerHTML = RENDER[key]();
  document.getElementById("main").scrollTop = 0;
  if (key === "settings") bindSettings();
}
document.getElementById("tagline").textContent = C.TAGLINE;
document.getElementById("disclaimer").textContent = C.DISCLAIMER;
window.addEventListener("hashchange", go);
document.addEventListener("DOMContentLoaded", go);
</script>
